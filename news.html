<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eaf5f7">
<title>Frétt | Barnaskóli Kársness</title>
<meta name="description" content="Frétt frá Barnaskóla Kársness.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Fara í meginefni</a>

  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div id="quick-contact" class="quick-contact-bar"></div>
  <header id="site-header"></header>
  <div class="back-nav" id="back-nav"></div>
  <div class="page-shell" id="quick-links" style="padding-bottom:0"></div>

  <!--
    Single reusable news detail page (CLAUDE.md "News & Banner": "a single
    reusable news.html?id=<id> detail page — not a modal, needs to be
    shareable/linkable"). data-page-key="news" only drives the shared
    chrome fetch (site.js); the actual news content comes from a separate
    get-news-item.js fetch in js/news-page.js, not from a page:<slug> Blob.
  -->
  <main class="page-shell" id="main-content" data-page-key="news">
    <div class="page-hero" id="news-hero">
      <div class="page-eyebrow"><span class="status-dot"></span>Fréttir</div>
      <h1>Hleð frétt…</h1>
    </div>

    <div class="news-cover" id="news-cover" hidden>
      <img id="news-cover-img" src="" alt="">
    </div>

    <article class="page-content" id="news-content">
      <p>Sæki frétt…</p>
    </article>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/site-data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/resource-icons.js"></script>
  <script src="js/vendor/dompurify.min.js"></script>
  <script src="js/render-content.js"></script>
  <script src="js/site.js"></script>
  <script src="js/news-page.js"></script>
</body>
</html>
